service_name: proxy-service
env: local
version: dev

log_level: debug
shutdown_timeout: 10s

http:
  addr: ":8085"
  timeout: 5s

proxy:
  listen_addr: ":9095"
  upstream_addr: "localhost:9091"
  timeout: 5s

auth_grpc:
  addr: "localhost:44044"
  timeout: 3s

auth_tls:
  enabled: true
  ca_file: certs/ca.crt
  server_name: auth-service
  client_cert_file: certs/gateway-client.crt
  client_key_file: certs/gateway-client.key


faults:
  delay: 0s
